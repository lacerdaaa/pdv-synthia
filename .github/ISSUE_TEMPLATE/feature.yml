name: Ideia ou melhoria
description: Proponha algo novo para o caixa, a retaguarda ou o servidor
labels: [melhoria]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema da loja isso resolve
      description: Conte a situação do dia a dia (balcão, estoque, fechamento, fiscal...).
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: Como você imagina. Se mexe em evento, tabela ou sync, diga como fica com caixas na versão anterior.
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que você considerou
